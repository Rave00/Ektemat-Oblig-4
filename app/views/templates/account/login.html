{% extends "base.html" %}
{% block title %}Log in · Ekte Mat Online{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Log in</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="email">E-mail address</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="button">Log in</button>
  </form>
  <p class="small">No account? <a href="{{ url_for('account.register', next=next or None) }}">Register</a></p>
</section>
{% endblock %}
